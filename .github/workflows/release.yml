name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DISK_SIZE_MB: "32"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "tag=v$V" >>"$GITHUB_OUTPUT"
          if [[ "$V" == *-* || "${{ inputs.prerelease }}" == "true" ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Cache xmake
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/xmake
            ~/.local/share/xmake
          key: hsrc-xmake-bin-v1
          restore-keys: hsrc-xmake-bin-

      - name: Setup
        run: bash scripts/ci-install-deps.sh

      - name: Build
        run: |
          xmake f -y -p cross -a i386 --cross=i686-elf-
          xmake -j"$(nproc)"

      - name: Smoke boot
        run: bash scripts/smoke-boot.sh 40

      - name: Pack
        run: bash scripts/pack-release.sh --skip-build "${{ steps.ver.outputs.version }}"

      - name: Ensure tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG"; git push origin "$TAG"; }

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          NAME="hsrc-kernel-${VER}"
          NOTES="hsrc-kernel ${VER}

          \`\`\`bash
          tar -xzf ${NAME}.tar.gz && cd ${NAME} && ./run.sh
          \`\`\`

          Mount: \`sudo mount -o loop disk.img /mnt\`

          - \`${NAME}.tar.gz\` — full runnable tree
          - \`${NAME}-image.tar.gz\` — boot + disk + run.sh
          - \`${NAME}-boot.tar.gz\` — kernel + initrd
          - \`${NAME}-executables.tar.gz\` — .exec / .dynlib
          - \`${NAME}.sha256\` — checksums
          "
          FILES=(
            "dist/${NAME}.tar.gz"
            "dist/${NAME}-image.tar.gz"
            "dist/${NAME}-boot.tar.gz"
            "dist/${NAME}-executables.tar.gz"
            "dist/${NAME}.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            extra=()
            [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]] && extra+=(--prerelease)
            gh release create "$TAG" "${FILES[@]}" \
              --title "hsrc-kernel ${VER}" \
              --notes "$NOTES" \
              "${extra[@]}"
          fi
