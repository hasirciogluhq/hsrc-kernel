name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
          build-cache: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 \
            gcc-i686-linux-gnu g++-i686-linux-gnu binutils-i686-linux-gnu
          for t in gcc g++ ld objcopy nm ar as ranlib strip; do
            sudo ln -sf "$(command -v i686-linux-gnu-$t)" /usr/local/bin/i686-elf-$t
          done

      - name: Version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "tag=v$V" >>"$GITHUB_OUTPUT"
          if [[ "$V" == *-* || "${{ inputs.prerelease }}" == "true" ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          xmake f -y -p cross -a i386 --cross=i686-elf-
          DISK_SIZE_MB=32 xmake -j"$(nproc)"

      - name: Smoke boot
        run: bash scripts/smoke-boot.sh 40

      - name: Pack
        run: DISK_SIZE_MB=32 bash scripts/pack-release.sh --skip-build "${{ steps.ver.outputs.version }}"

      - name: Ensure tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG"; git push origin "$TAG"; }

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          NAME="hsrc-kernel-${VER}"
          FILES=(
            "dist/${NAME}.tar.gz"
            "dist/${NAME}-image.tar.gz"
            "dist/${NAME}-boot.tar.gz"
            "dist/${NAME}-executables.tar.gz"
            "dist/${NAME}.sha256"
          )
          NOTES="hsrc-kernel ${VER}

          \`\`\`bash
          tar -xzf ${NAME}.tar.gz && cd ${NAME} && ./run.sh
          \`\`\`

          Mount: \`sudo mount -o loop disk.img /mnt\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            extra=()
            [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]] && extra+=(--prerelease)
            gh release create "$TAG" "${FILES[@]}" \
              --title "hsrc-kernel ${VER}" --notes "$NOTES" "${extra[@]}"
          fi
