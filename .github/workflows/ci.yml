name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache xmake + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/xmake
            ~/.local/share/xmake
            .xmake
            build/.build_cache
          key: hsrc-xmake-${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'userspace/**/xmake.lua') }}-${{ github.sha }}
          restore-keys: |
            hsrc-xmake-${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'userspace/**/xmake.lua') }}-
            hsrc-xmake-

      - name: Setup
        run: bash scripts/ci-install-deps.sh

      - name: Build
        run: |
          xmake f -y -p cross -a i386 --cross=i686-elf-
          xmake -j"$(nproc)"

      - name: Smoke boot
        run: bash scripts/smoke-boot.sh 35

      - name: Pack
        if: github.event_name != 'pull_request'
        run: bash scripts/pack-release.sh --skip-build "ci-${GITHUB_SHA::7}"

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hsrc-ci-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ github.sha }}
          path: build/smoke-boot.log
          if-no-files-found: ignore
