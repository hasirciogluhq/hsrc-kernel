name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
          build-cache: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 \
            gcc-i686-linux-gnu g++-i686-linux-gnu binutils-i686-linux-gnu
          for t in gcc g++ ld objcopy nm ar as ranlib strip; do
            sudo ln -sf "$(command -v i686-linux-gnu-$t)" /usr/local/bin/i686-elf-$t
          done

      - name: Build
        run: |
          xmake f -y -p cross -a i386 --cross=i686-elf-
          xmake -j"$(nproc)"

      - name: Smoke boot
        run: bash scripts/smoke-boot.sh 35

      - name: Pack
        if: github.event_name != 'pull_request'
        run: bash scripts/pack-release.sh --skip-build "ci-${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: hsrc-ci-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-log-${{ github.sha }}
          path: build/smoke-boot.log
          if-no-files-found: ignore
